# Docker Desktop stack: RabbitMQ plus two Api.DIA replicas.
# SQL Server stays on the host. Copy .env.example to .env and set WALLET_CONNECTION_STRING
# before `docker compose up`. The Producer is not in this file; run it from Visual Studio.

name: dia

services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: src/Api.DIA/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Wallet: ${WALLET_CONNECTION_STRING}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__User: guest
      RabbitMq__Password: guest
      RabbitMq__PrefetchCount: "1"
      Demo__AllowReset: "true"
      Demo__InitialBalance: "1100"
      Demo__UserId: "11111111-1111-1111-1111-111111111111"
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
